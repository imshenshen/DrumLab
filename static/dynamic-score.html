<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DrumLab — Dynamic Score</title>
<script src="/static/vendor/opensheetmusicdisplay.min.js"></script>
<style>
  :root { --bg:#101216; --panel:#1d2026; --line:#303540; --text:#e5e8ee; --dim:#9299a8; --blue:#4ea1ff; --green:#2f9e57; }
  * { box-sizing:border-box; }
  html,body { margin:0; width:100%; height:100%; overflow:hidden; background:var(--bg); color:var(--text); font:14px/1.4 system-ui,-apple-system,"Segoe UI",sans-serif; }
  body { display:grid; grid-template-rows:auto auto auto 1fr; }
  header { display:flex; align-items:center; gap:14px; min-height:54px; padding:8px 18px; background:var(--panel); border-bottom:1px solid var(--line); }
  h1 { margin:0; color:var(--blue); font-size:15px; letter-spacing:2px; text-transform:uppercase; }
  #title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--dim); }
  #status { margin-left:auto; white-space:nowrap; color:var(--dim); }
  #status.ready { color:#55c77a; }
  #controls { display:grid; grid-template-columns:auto auto minmax(100px,1fr) auto auto auto; align-items:center; gap:12px; padding:9px 18px; background:#17191e; border-bottom:1px solid var(--line); }
  button { border:0; border-radius:5px; padding:8px 18px; color:white; background:var(--green); cursor:pointer; font-weight:700; }
  button:disabled { opacity:.4; cursor:default; }
  #stop { background:#a84343; }
  input[type=range] { width:100%; accent-color:var(--blue); }
  #clock { font:13px ui-monospace,SFMono-Regular,Consolas,monospace; min-width:102px; text-align:right; }
  select { color:var(--text); background:#252932; border:1px solid var(--line); border-radius:4px; padding:6px; }
  #notation-controls { display:flex; align-items:center; gap:10px; padding:7px 18px; background:#20232a; border-bottom:1px solid var(--line); }
  #notation-controls label { display:flex; align-items:center; gap:6px; color:var(--dim); }
  #notation-controls input { width:76px; color:var(--text); background:#252932; border:1px solid var(--line); border-radius:4px; padding:6px; }
  #notation-save { padding:7px 14px; background:var(--blue); }
  #notation-status { color:var(--dim); font-size:12px; }
  #viewport { overflow:auto; background:#d9dce2; scroll-behavior:smooth; position:relative; }
  #sheet-wrap { width:calc(100% - 28px); max-width:none; min-height:calc((100vw - 28px) * 1.4142); margin:14px auto; padding:22px 28px 60px; background:#fff; box-shadow:0 3px 20px #0005; }
  #sheet { color:#000; }
  #message { position:absolute; inset:0; display:grid; place-items:center; padding:30px; text-align:center; color:var(--dim); background:var(--bg); z-index:5; }
  #message.hidden { display:none; }
  body.recording { grid-template-rows:1fr; }
  body.recording header, body.recording #controls, body.recording #notation-controls { display:none; }
  body.recording #viewport { grid-row:1; }
  body.recording #sheet-wrap { width:calc(100% - 24px); max-width:none; margin:12px auto; padding:18px 22px 45px; }
  @media (max-width:700px) {
    #controls { grid-template-columns:auto auto 1fr auto; gap:7px; padding:7px; }
    #speed, #paper-size { display:none; }
    #sheet-wrap { width:100%; margin:0; padding:12px 8px 40px; }
    header { padding:7px 10px; }
  }
</style>
</head>
<body>
<header>
  <h1>DrumLab</h1>
  <span id="title">Dynamic drum score</span>
  <span id="status">Loading task…</span>
</header>
<div id="controls">
  <button id="play" disabled>Play</button>
  <button id="stop" disabled>Stop</button>
  <input id="seek" type="range" min="0" max="1" step="0.01" value="0" disabled>
  <span id="clock">00:00 / 00:00</span>
  <label id="speed">Speed <select><option value="0.5">0.5×</option><option value="0.75">0.75×</option><option value="1" selected>1×</option><option value="1.25">1.25×</option><option value="1.5">1.5×</option></select></label>
  <label id="paper-size">A4 显示 <select><option value="fit">适应窗口</option><option value="small">小</option><option value="medium" selected>中</option><option value="large">大</option></select></label>
</div>
<div id="notation-controls">
  <label>拍号 <input id="notation-beats" type="number" min="1" max="32" value="4"> / <select id="notation-beat-unit"><option>1</option><option>2</option><option selected>4</option><option>8</option><option>16</option><option>32</option></select></label>
  <label>谱面 BPM <input id="notation-tempo" type="number" min="20" max="999" step="0.001" value="120"></label>
  <label>计时 <select id="timing-mode"><option value="beat_map">逐拍映射</option><option value="fixed">固定 BPM</option></select></label>
  <label>网格 <select id="notation-grid"><option>1/8</option><option selected>1/16</option><option>1/16T</option><option>1/32</option></select></label>
  <label>弱起 <select id="pickup-mode"><option value="auto">自动检测</option><option value="none">无弱起</option><option value="manual">手动</option></select></label>
  <label>拍数 <input id="pickup-beats" type="number" min="0" step="0.25" value="0"></label>
  <label>忽略前导 <input id="notation-offset" type="number" min="0" step="0.01" value="0"> 秒</label>
  <label>每行 <input id="measures-per-system" type="number" min="1" max="6" value="3"> 小节</label>
  <button id="notation-save" type="button" disabled>保存谱面设置</button>
  <span id="notation-status"></span>
</div>
<main id="viewport">
  <div id="message">Waiting for the task…</div>
  <div id="sheet-wrap"><div id="sheet"></div></div>
</main>
<audio id="audio" preload="auto"></audio>
<script>
"use strict";
window.__DRUMLAB_SCORE_READY__ = false;
window.__DRUMLAB_SCORE_FINISHED__ = false;
window.__DRUMLAB_RECORDING_STARTED__ = false;

const taskId = decodeURIComponent(location.pathname.split("/").filter(Boolean).pop());
const params = new URLSearchParams(location.search);
const recordingKind = params.get("recording");
const recordingMode = recordingKind === "1" || recordingKind === "offline";
const offlineRecordingMode = recordingKind === "offline";
if (recordingMode) document.body.classList.add("recording");
const $ = id => document.getElementById(id);
const audio = $("audio"), play = $("play"), stop = $("stop"), seek = $("seek");
const viewport = $("viewport"), statusEl = $("status"), message = $("message");
let osmd = null, meta = null, raf = 0, cursorLastTime = -1;
const A4_WIDTH_UNITS = 2100;
const A4_HEIGHT_UNITS = 2970;
const PAPER_ZOOM = { small: 0.30, medium: 0.40, large: 0.50 };

function fmt(sec) {
  sec = Math.max(0, Number(sec) || 0);
  const m = Math.floor(sec / 60), s = Math.floor(sec % 60);
  return String(m).padStart(2,"0") + ":" + String(s).padStart(2,"0");
}

async function json(url, options) {
  const response = await fetch(url, options);
  if (!response.ok) {
    let detail = response.statusText;
    try { detail = (await response.json()).detail || detail; } catch (_) {}
    throw new Error(detail);
  }
  return response.json();
}

async function waitForTask() {
  while (true) {
    const task = await json(`/api/tasks/${encodeURIComponent(taskId)}`);
    $("title").textContent = task.source_name || task.id;
    statusEl.textContent = `${task.status} · ${task.stage} · ${Math.round((task.progress || 0) * 100)}%`;
    message.textContent = task.error || task.message || "Waiting for the task…";
    if (task.status === "completed") return task;
    if (["failed","cancelled","timed_out"].includes(task.status)) {
      throw new Error(task.error || task.message || `Task ${task.status}`);
    }
    await new Promise(resolve => setTimeout(resolve, 1200));
  }
}

function cursorTimestamp() {
  try {
    const iterator = osmd.cursor.iterator;
    const stamp = iterator.currentTimeStamp || iterator.CurrentTimeStamp;
    const wholeNotes = stamp.realValue ?? stamp.RealValue;
    // OSMD timestamps are fractions of a whole note (a 4/4 measure is 1.0),
    // while BPM is quarter-notes per minute. The previous conversion omitted
    // this factor of four, making the score cursor run roughly 4x too fast.
    const quarterPosition = Number(wholeNotes) * 4;
    const beatUnit = Number(meta.beat_unit || 4);
    const beatPosition = quarterPosition / (4 / beatUnit);
    const beatMap = meta.timing_mode === "beat_map" ? meta.score_beat_times : null;
    if (Array.isArray(beatMap) && beatMap.length >= 2) {
      const index = Math.max(0, Math.min(beatMap.length - 2, Math.floor(beatPosition)));
      const fraction = Math.max(0, Math.min(1, beatPosition - index));
      return Number(beatMap[index]) + fraction * (Number(beatMap[index + 1]) - Number(beatMap[index]));
    }
    return Number(meta.notation_offset_seconds || 0)
      + quarterPosition * 60 / Number(meta.notation_tempo || meta.tempo);
  } catch (_) { return Infinity; }
}

function scoreTimeFromAudio(seconds) {
  return Math.max(0, Number(seconds || 0));
}

function nextCursor() {
  try {
    osmd.cursor.next();
    return !osmd.cursor.iterator.endReached;
  } catch (_) { return false; }
}

function previousCursor() {
  try {
    osmd.cursor.previous();
    return true;
  } catch (_) { return false; }
}

function placeCursor(seconds, forceReset = false) {
  if (!osmd || !meta) return;
  if (forceReset || seconds + 0.05 < cursorLastTime) {
    osmd.cursor.reset();
    osmd.cursor.show();
  }
  let guard = 0;
  // Keep the cursor at the latest score position at-or-before audio.currentTime.
  // The old loop advanced while current <= target, leaving the cursor one event
  // ahead. That became especially visible after seeking on the progress bar.
  while (cursorTimestamp() < seconds - 0.025 && guard++ < 20000) {
    const before = cursorTimestamp();
    if (!nextCursor()) break;
    const after = cursorTimestamp();
    if (after > seconds + 0.025) {
      previousCursor();
      break;
    }
    if (after <= before) break;
  }
  cursorLastTime = seconds;
  const element = osmd.cursor.cursorElement || document.querySelector("[id^=cursorImg]");
  if (element) {
    const box = element.getBoundingClientRect();
    const view = viewport.getBoundingClientRect();
    const target = viewport.scrollTop + box.top - view.top - view.height * 0.30;
    if (Math.abs(target - viewport.scrollTop) > view.height * 0.12) viewport.scrollTo({top:Math.max(0,target),behavior:"smooth"});
  }
}

// Export the engraved cursor positions once.  The offline recorder combines a
// single clean score screenshot with this compact timeline, so it never has to
// play the song or take one browser screenshot per video frame.
window.__DRUMLAB_EXPORT_TIMELINE__ = () => {
  if (!osmd || !meta) throw new Error("Score is not ready");
  const wrap = $("sheet-wrap");
  const sheetBox = wrap.getBoundingClientRect();
  const points = [];
  osmd.cursor.reset();
  osmd.cursor.show();
  let guard = 0;
  while (guard++ < 50000) {
    const seconds = cursorTimestamp();
    const element = osmd.cursor.cursorElement || document.querySelector("[id^=cursorImg]");
    if (element && Number.isFinite(seconds)) {
      const box = element.getBoundingClientRect();
      const point = {
        t: seconds,
        x: box.left - sheetBox.left,
        y: box.top - sheetBox.top,
        width: Math.max(3, box.width),
        height: Math.max(10, box.height),
      };
      const previous = points[points.length - 1];
      if (!previous || Math.abs(previous.t - point.t) > 0.0001 ||
          Math.abs(previous.x - point.x) > 0.5 || Math.abs(previous.y - point.y) > 0.5) {
        points.push(point);
      }
    }
    if (!nextCursor()) break;
  }
  osmd.cursor.hide();
  cursorLastTime = -1;
  return {
    points,
    width: Math.ceil(wrap.scrollWidth),
    height: Math.ceil(wrap.scrollHeight),
    duration: Number(audio.duration || meta.duration || 0),
  };
};

function update() {
  seek.value = String(audio.currentTime || 0);
  $("clock").textContent = `${fmt(audio.currentTime)} / ${fmt(audio.duration || meta?.duration)}`;
  placeCursor(scoreTimeFromAudio(audio.currentTime));
  if (!audio.paused && !audio.ended) raf = requestAnimationFrame(update);
}

play.addEventListener("click", async () => {
  if (audio.paused) {
    await audio.play();
    play.textContent = "Pause";
    cancelAnimationFrame(raf); update();
  } else {
    audio.pause(); play.textContent = "Play";
  }
});
stop.addEventListener("click", () => {
  audio.pause(); audio.currentTime = 0; play.textContent = "Play";
  placeCursor(0, true); viewport.scrollTop = 0; update();
});
seek.addEventListener("input", () => { audio.currentTime = Number(seek.value); placeCursor(scoreTimeFromAudio(audio.currentTime), true); update(); });
$("speed").querySelector("select").addEventListener("change", e => { audio.playbackRate = Number(e.target.value); });
function selectedPaperSize() {
  const fromQuery = params.get("paper_size");
  return ["fit","small","medium","large"].includes(fromQuery) ? fromQuery : null;
}

async function applyPaperSize() {
  if (!osmd) return;
  const choice = $("paper-size").querySelector("select").value;
  let zoom = PAPER_ZOOM[choice];
  if (!zoom) {
    const availableWidth = Math.max(320, viewport.clientWidth - 28);
    const availableHeight = Math.max(450, viewport.clientHeight - 28);
    // A recording is a moving viewport over the score, so fit the paper to the
    // video width and let its height extend below the frame. Fitting both axes
    // would shrink the entire A4 page into landscape recordings and make the
    // notation unreadably small. The cursor-following recorder scrolls through
    // the resulting full-width score as playback advances.
    zoom = recordingMode
      ? availableWidth / A4_WIDTH_UNITS
      : Math.min(availableWidth / A4_WIDTH_UNITS, availableHeight / A4_HEIGHT_UNITS);
  }

  // A4_P fixes the engraving/page layout. Zoom changes only the displayed paper
  // size, so measure/system breaks remain identical at every UI/video size.
  osmd.Zoom = zoom;
  const wrap = $("sheet-wrap");
  wrap.style.width = `${Math.round(A4_WIDTH_UNITS * zoom + 56)}px`;
  wrap.style.minHeight = `${Math.round(A4_HEIGHT_UNITS * zoom + 82)}px`;

  await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  osmd.render();
  placeCursor(scoreTimeFromAudio(audio.currentTime), true);
}
$("paper-size").querySelector("select").addEventListener("change", applyPaperSize);
function syncPickupInput() {
  $("pickup-beats").disabled = $("pickup-mode").value !== "manual";
  $("notation-tempo").disabled = $("timing-mode").value === "beat_map";
}
$("pickup-mode").addEventListener("change", syncPickupInput);
$("timing-mode").addEventListener("change", syncPickupInput);
$("notation-save").addEventListener("click", async () => {
  const button = $("notation-save"), noteStatus = $("notation-status");
  button.disabled = true; noteStatus.textContent = "正在重新生成 MusicXML…";
  try {
    await json(`/api/tasks/${encodeURIComponent(taskId)}/notation`, {
      method:"PATCH", headers:{"content-type":"application/json"},
      body:JSON.stringify({
        pickup_mode:$("pickup-mode").value,
        pickup_beats:Number($("pickup-beats").value),
        grid:$("notation-grid").value,
        beats_per_measure:Number($("notation-beats").value),
        beat_unit:Number($("notation-beat-unit").value),
        notation_tempo:Number($("notation-tempo").value),
        timing_mode:$("timing-mode").value,
        notation_offset_seconds:Number($("notation-offset").value),
        measures_per_system:Number($("measures-per-system").value),
      }),
    });
    noteStatus.textContent = "已保存，正在重新载入谱面…";
    location.reload();
  } catch (error) {
    noteStatus.textContent = error.message; button.disabled = false;
  }
});
audio.addEventListener("ended", () => {
  play.textContent = "Play";
  window.__DRUMLAB_SCORE_FINISHED__ = true;
  update();
});

(async () => {
  try {
    const task = await waitForTask();
    const options = task.options || {};
    $("pickup-mode").value = options.pickup_mode || "auto";
    $("notation-grid").value = options.grid || "1/16";
    $("notation-beats").value = String(options.beats_per_measure || 4);
    $("notation-beat-unit").value = String(options.beat_unit || 4);
    $("notation-tempo").value = String(options.notation_tempo || task.tempo || 120);
    $("timing-mode").value = options.timing_mode || "beat_map";
    $("pickup-beats").value = String(options.pickup_beats || 0);
    $("notation-offset").value = String(options.notation_offset_seconds || 0);
    $("pickup-beats").max = String(Math.max(0, Number(options.beats_per_measure || 4) - 0.01));
    $("measures-per-system").value = String(options.measures_per_system || 3);
    syncPickupInput();
    const confidence = options.pickup_confidence;
    $("notation-status").textContent = options.pickup_mode === "auto" && confidence != null
      ? `自动检测置信度 ${Math.round(Number(confidence) * 100)}%`
      : "";
    $("notation-save").disabled = recordingMode;
    meta = await json(`/api/tasks/${encodeURIComponent(taskId)}/events`);
    const xmlResponse = await fetch(`/api/tasks/${encodeURIComponent(taskId)}/musicxml`);
    if (!xmlResponse.ok) throw new Error("Could not load MusicXML");
    const xml = await xmlResponse.text();
    osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("sheet", {
      autoResize: false, backend: "svg", drawTitle: false, drawPartNames: false,
      followCursor: false, pageFormat: "A4_P", pageBackgroundColor: "#ffffff",
      newSystemFromXML: true,
    });
    await osmd.load(xml);
    const requestedPaperSize = selectedPaperSize();
    if (requestedPaperSize) $("paper-size").querySelector("select").value = requestedPaperSize;
    if (recordingMode && !requestedPaperSize) $("paper-size").querySelector("select").value = "fit";
    await applyPaperSize();
    osmd.cursor.show();
    audio.src = `/api/tasks/${encodeURIComponent(taskId)}/audio`;
    await new Promise((resolve, reject) => {
      if (audio.readyState >= 1) return resolve();
      audio.addEventListener("loadedmetadata", resolve, {once:true});
      audio.addEventListener("error", () => reject(new Error("Could not load task audio")), {once:true});
    });
    seek.max = String(audio.duration || meta.duration || 1);
    play.disabled = stop.disabled = seek.disabled = false;
    message.classList.add("hidden");
    const scoreTempo = Number(meta.notation_tempo || meta.tempo);
    statusEl.textContent = `${scoreTempo.toFixed(3)} BPM · ${Object.values(meta.counts).reduce((a,b)=>a+b,0)} hits`;
    statusEl.classList.add("ready");
    placeCursor(scoreTimeFromAudio(0), true); update();
    if (recordingMode && !offlineRecordingMode) {
      // Recording mode hides the transport controls, so the server cannot click Play.
      // Muted autoplay is allowed in headless Chromium and the captured WebM is silent.
      audio.muted = true;
      await audio.play();
      play.textContent = "Pause";
      cancelAnimationFrame(raf); update();
      window.__DRUMLAB_RECORDING_STARTED__ = true;
    }
    window.__DRUMLAB_SCORE_READY__ = true;
  } catch (error) {
    statusEl.textContent = "Error";
    message.textContent = error.message;
  }
})();
</script>
</body>
</html>
