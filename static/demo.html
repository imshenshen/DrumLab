<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DrumLab — 任务控制台</title>
<style>
  :root { --bg:#111318; --panel:#1d2026; --panel2:#242832; --line:#333945; --text:#e3e7ee; --dim:#949cab; --blue:#4ea1ff; --green:#35a761; --red:#d05a58; --amber:#d7a63d; }
  * { box-sizing:border-box; }
  html { color-scheme:dark; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:14px; padding:12px max(18px,calc((100vw - 1380px)/2)); border-bottom:1px solid var(--line); background:#181b21ee; backdrop-filter:blur(12px); }
  h1 { margin:0; color:var(--blue); font-size:17px; letter-spacing:2px; }
  header span { color:var(--dim); }
  header a { margin-left:auto; color:var(--blue); text-decoration:none; }
  main { width:min(1380px,calc(100% - 28px)); margin:20px auto 46px; display:grid; gap:18px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:18px; box-shadow:0 8px 30px #0002; }
  h2 { margin:0 0 14px; font-size:13px; color:var(--dim); letter-spacing:1.5px; text-transform:uppercase; }
  .form-grid { display:grid; grid-template-columns:minmax(280px,2fr) repeat(5,minmax(100px,1fr)); gap:12px; align-items:end; }
  label { display:grid; gap:5px; color:var(--dim); font-size:12px; }
  input,select { width:100%; min-width:0; height:38px; padding:7px 9px; border:1px solid var(--line); border-radius:6px; background:var(--panel2); color:var(--text); font:inherit; outline:none; }
  input:focus,select:focus { border-color:var(--blue); }
  .path { grid-column:span 2; }
  .thresholds { margin-top:12px; }
  summary { cursor:pointer; color:var(--dim); user-select:none; }
  .threshold-grid { display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin-top:10px; }
  button,.button { display:inline-flex; align-items:center; justify-content:center; gap:6px; min-height:34px; padding:7px 13px; border:1px solid transparent; border-radius:6px; background:var(--green); color:white; text-decoration:none; font:inherit; font-weight:650; cursor:pointer; }
  button:hover,.button:hover { filter:brightness(1.12); }
  button:disabled { opacity:.38; cursor:not-allowed; filter:none; }
  button.secondary,.button.secondary { background:var(--panel2); border-color:var(--line); color:var(--text); }
  .submit-row { display:flex; align-items:center; gap:12px; margin-top:14px; }
  #submit { min-width:150px; }
  #form-status { color:var(--dim); overflow-wrap:anywhere; }
  #form-status.error { color:var(--red); }
  .queue-head { display:flex; align-items:center; gap:10px; margin-bottom:12px; }
  .queue-head h2 { margin:0; }
  #queue-summary { color:var(--dim); }
  #refresh { margin-left:auto; }
  .table-wrap { overflow:auto; border:1px solid var(--line); border-radius:8px; }
  table { width:100%; border-collapse:collapse; min-width:1040px; }
  th,td { padding:11px 12px; border-bottom:1px solid var(--line); text-align:left; vertical-align:top; }
  th { position:sticky; top:0; background:#20242c; color:var(--dim); font-size:11px; letter-spacing:1px; text-transform:uppercase; }
  tbody tr:last-child td { border-bottom:0; }
  tbody tr:hover { background:#22263088; }
  .task-name { max-width:300px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:650; }
  .task-id { color:var(--dim); font:11px ui-monospace,SFMono-Regular,Consolas,monospace; }
  .badge { display:inline-flex; border-radius:12px; padding:2px 9px; font-size:11px; font-weight:700; background:#343a46; }
  .badge.completed { background:#173d29; color:#65d68e; }
  .badge.running { background:#163b5d; color:#71baff; }
  .badge.queued { background:#4a3818; color:#efc565; }
  .badge.failed { background:#512525; color:#ff8b88; }
  progress { width:110px; height:7px; accent-color:var(--blue); }
  .stage { display:block; margin-top:4px; color:var(--dim); font-size:11px; }
  .actions { display:flex; flex-wrap:wrap; gap:7px; min-width:250px; }
  .record-controls { display:grid; grid-template-columns:76px 84px auto; gap:6px; margin-top:7px; }
  .record-controls select,.record-controls input { height:32px; padding:4px 6px; }
  .recordings { display:grid; gap:5px; margin-top:8px; }
  .recording { display:flex; align-items:center; gap:7px; color:var(--dim); font-size:11px; }
  .recording a { color:var(--blue); }
  .empty { padding:34px; color:var(--dim); text-align:center; }
  .error-text { color:var(--red); max-width:300px; overflow-wrap:anywhere; }
  footer { padding:16px; text-align:center; color:var(--dim); font-size:11px; }
  @media (max-width:980px) { .form-grid { grid-template-columns:repeat(3,1fr); } .path { grid-column:1/-1; } }
  @media (max-width:620px) { main { width:min(100% - 16px,1380px); margin-top:8px; } .card { padding:12px; } .form-grid { grid-template-columns:1fr 1fr; } .path { grid-column:1/-1; } .threshold-grid { grid-template-columns:1fr 1fr; } header { padding:10px; } header span { display:none; } }
</style>
</head>
<body>
<header><h1>DrumLab</h1><span>任务控制台</span><a href="/">返回工作台</a></header>
<main>
  <section class="card">
    <h2>创建鼓谱任务</h2>
    <form id="task-form">
      <div class="form-grid">
        <label class="path">服务器本地音频绝对路径
          <input id="audio-path" required placeholder="/home/shenshen/music/song.flac" autocomplete="off">
        </label>
        <label>服务端口<input id="service-port" type="number" min="1" max="65535" required></label>
        <label>音频类型<select id="source-mode"><option value="full_mix">完整混音（先分离）</option><option value="drum_only">纯鼓音频（跳过分离）</option></select></label>
        <label>Demucs 模型<select id="model"><option>htdemucs</option><option>htdemucs_ft</option><option>mdx_extra</option><option>mdx_extra_q</option></select></label>
        <label>设备<select id="device"><option value="cuda">CUDA</option><option value="cpu">CPU</option></select></label>
        <label>量化网格<select id="grid"><option>1/16</option><option>1/8</option><option>1/16T</option><option>1/32</option></select></label>
        <label>ADTOF FPS<input id="fps" type="number" min="25" max="200" value="100"></label>
      </div>
      <details class="thresholds">
        <summary>识别阈值（可选）</summary>
        <div class="threshold-grid">
          <label>Kick<input data-threshold="kick" type="number" min="0" max="1" step="0.01" value="0.22"></label>
          <label>Snare<input data-threshold="snare" type="number" min="0" max="1" step="0.01" value="0.24"></label>
          <label>Tom<input data-threshold="tom" type="number" min="0" max="1" step="0.01" value="0.32"></label>
          <label>Hi-hat<input data-threshold="hihat" type="number" min="0" max="1" step="0.01" value="0.22"></label>
          <label>Cymbal<input data-threshold="cymbal" type="number" min="0" max="1" step="0.01" value="0.30"></label>
        </div>
      </details>
      <div class="submit-row"><button id="submit" type="submit">加入任务队列</button><span id="form-status">路径必须存在于 DrumLab 服务器上。</span></div>
    </form>
  </section>

  <section class="card">
    <div class="queue-head"><h2>任务队列</h2><span id="queue-summary"></span><button id="refresh" class="secondary" type="button">立即刷新</button></div>
    <div class="table-wrap">
      <table>
        <thead><tr><th>任务</th><th>状态</th><th>参数</th><th>结果</th><th>操作与录制</th></tr></thead>
        <tbody id="tasks"><tr><td colspan="5" class="empty">正在加载任务…</td></tr></tbody>
      </table>
    </div>
  </section>
</main>
<footer>DrumLab __VER__ · 任务按创建时间倒序显示</footer>
<script>
"use strict";
const $ = id => document.getElementById(id);
const esc = value => String(value ?? "");
let polling = null;

async function api(url, options) {
  const response = await fetch(url, options);
  if (!response.ok) {
    let detail = response.statusText;
    try { detail = (await response.json()).detail || detail; } catch (_) {}
    throw new Error(detail);
  }
  return response.json();
}

function el(tag, className, text) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined) node.textContent = text;
  return node;
}

function actionLink(label, href, enabled = true) {
  if (!enabled) {
    const button = el("button", "secondary", label); button.disabled = true; return button;
  }
  const link = el("a", "button secondary", label); link.href = href; link.target = "_blank"; link.rel = "noopener"; return link;
}

function recordingRows(task) {
  const wrap = el("div", "recordings");
  const values = Object.values(task.recordings || {}).sort((a,b) => b.created_at.localeCompare(a.created_at));
  for (const recording of values) {
    const row = el("div", "recording");
    row.append(el("span", `badge ${recording.status}`, recording.status));
    row.append(document.createTextNode(`${recording.width}×${recording.height}`));
    if (recording.status === "completed") {
      const download = el("a", "", "下载 WebM"); download.href = recording.url; row.append(download);
    } else if (recording.error) row.append(el("span", "error-text", recording.error));
    wrap.append(row);
  }
  return wrap;
}

async function startRecording(taskId, ratio, width, button) {
  button.disabled = true;
  try {
    await api(`/api/tasks/${encodeURIComponent(taskId)}/recordings`, {
      method:"POST", headers:{"content-type":"application/json"},
      body:JSON.stringify({service_port:Number($("service-port").value),aspect_ratio:ratio,width:Number(width)}),
    });
    await loadTasks();
  } catch (error) { alert(error.message); }
  finally { button.disabled = false; }
}

function taskRow(task) {
  const tr = document.createElement("tr");
  const identity = document.createElement("td");
  const name = el("div", "task-name", task.source_name); name.title = task.source_path || task.source_name;
  identity.append(name, el("div", "task-id", task.id));

  const state = document.createElement("td");
  state.append(el("span", `badge ${task.status}`, task.status));
  const progress = document.createElement("progress"); progress.max = 1; progress.value = task.progress || 0;
  state.append(document.createElement("br"), progress, el("span", "stage", `${task.stage} · ${Math.round((task.progress || 0)*100)}%`));
  if (task.error) state.append(el("div", "error-text", task.error));

  const options = document.createElement("td");
  const sourceLabel = task.options?.source_mode === "drum_only" ? "drum only" : esc(task.options?.model);
  options.append(el("div", "", `${sourceLabel} · ${esc(task.options?.device)}`), el("div", "stage", `${esc(task.options?.grid)} · ${esc(task.options?.fps)} FPS`));

  const result = document.createElement("td");
  if (task.status === "completed") {
    const hits = Object.values(task.hit_counts || {}).reduce((sum,value)=>sum+value,0);
    result.append(el("div", "", `${Number(task.tempo).toFixed(1)} BPM`), el("div", "stage", `${hits} hits · ${Number(task.duration).toFixed(1)}s`));
  } else result.append(el("span", "stage", task.message || "—"));

  const actionsCell = document.createElement("td");
  const actions = el("div", "actions");
  const completed = task.status === "completed";
  actions.append(actionLink("打开动态谱", task.urls.page, completed));
  actions.append(actionLink("MusicXML", task.urls.musicxml, completed));
  actions.append(actionLink("MIDI", `/api/tasks/${encodeURIComponent(task.id)}/midi`, completed));
  actionsCell.append(actions);
  const controls = el("div", "record-controls");
  const ratio = document.createElement("select");
  for (const value of ["16:9","9:16","4:3","1:1"]) { const option=el("option","",value); option.value=value; ratio.append(option); }
  const width = document.createElement("input"); width.type="number"; width.min="320"; width.max="3840"; width.value="1920"; width.title="录制宽度";
  const record = el("button", "", "无声录制"); record.disabled = !completed;
  record.addEventListener("click", () => startRecording(task.id, ratio.value, width.value, record));
  controls.append(ratio,width,record);
  actionsCell.append(controls, recordingRows(task));
  tr.append(identity,state,options,result,actionsCell);
  return tr;
}

async function loadTasks() {
  try {
    const data = await api("/api/tasks?limit=200");
    const tbody = $("tasks"); tbody.replaceChildren();
    if (!data.tasks.length) {
      const row=document.createElement("tr"), cell=el("td","empty","暂无任务"); cell.colSpan=5; row.append(cell); tbody.append(row);
    } else data.tasks.forEach(task => tbody.append(taskRow(task)));
    const running = data.tasks.filter(task => task.status === "running").length;
    const queued = data.tasks.filter(task => task.status === "queued").length;
    $("queue-summary").textContent = `${data.tasks.length} 个任务 · ${running} 运行中 · ${queued} 排队中`;
  } catch (error) {
    $("queue-summary").textContent = `刷新失败：${error.message}`;
  }
}

$("task-form").addEventListener("submit", async event => {
  event.preventDefault();
  const status = $("form-status"), submit = $("submit");
  submit.disabled = true; status.className=""; status.textContent="正在提交…";
  const thresholds = {};
  document.querySelectorAll("[data-threshold]").forEach(input => { thresholds[input.dataset.threshold] = Number(input.value); });
  try {
    const task = await api("/api/tasks", {
      method:"POST", headers:{"content-type":"application/json"},
      body:JSON.stringify({
        audio_path:$("audio-path").value.trim(), service_port:Number($("service-port").value),
        model:$("model").value, device:$("device").value, source_mode:$("source-mode").value,
        grid:$("grid").value,
        fps:Number($("fps").value), thresholds,
      }),
    });
    status.textContent=`已加入队列：${task.id}`;
    await loadTasks();
  } catch (error) { status.className="error"; status.textContent=error.message; }
  finally { submit.disabled=false; }
});

$("refresh").addEventListener("click", loadTasks);
$("source-mode").addEventListener("change", event => {
  const drumOnly = event.target.value === "drum_only";
  $("model").disabled = drumOnly;
  $("model").title = drumOnly ? "纯鼓模式不会运行 Demucs" : "";
});
$("service-port").value = location.port || (location.protocol === "https:" ? 443 : 80);
loadTasks();
polling = setInterval(loadTasks, 1500);
</script>
</body>
</html>
